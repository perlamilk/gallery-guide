<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Gallery Guide</title>
  <meta name="description" content="A personal 3D guide to the Museum of Fine Arts, Boston.">
  <meta name="theme-color" content="#f2f2ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">

  <!-- Home-screen app (iOS) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gallery Guide">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="css/app.css">

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <main class="app" id="app">
    <canvas id="map" aria-label="3D map of the museum. Drag to rotate, pinch to zoom, tap a room."></canvas>

    <header class="masthead">
      <p class="masthead__eyebrow">MFA Boston</p>
      <h1 class="masthead__title" id="floorTitle">Level 2</h1>
      <p class="masthead__sub" id="floorSub"></p>
    </header>

    <button class="visit-pill glass" id="visitPill" type="button" hidden>
      <span class="visit-pill__dot" aria-hidden="true"></span>
      <span id="visitPillText">Visit</span>
    </button>

    <nav class="map-tools" aria-label="Map controls">
      <div class="floors glass" id="floors" role="radiogroup" aria-label="Floor"></div>
      <button class="tool glass" id="recenter" type="button" aria-label="Recenter Map">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 19 20l-7-4-7 4z"/></svg>
      </button>
    </nav>

    <div class="sheet-clip" id="sheetClip">
    <section class="sheet" id="sheet" data-state="peek" aria-label="Guide">
      <button class="sheet__grab" id="grab" type="button" aria-label="Resize Panel" aria-expanded="false"><span aria-hidden="true"></span></button>
      <div class="sheet__header" id="sheetHeader"></div>
      <div class="sheet__body" id="body"></div>
    </section>
    </div>

    <nav class="tabbar glass" id="tabbar" role="tablist" aria-label="Sections">
      <button class="tab" type="button" role="tab" data-tab="explore" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fillable" d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z" fill-opacity=".18"/><path d="M9 4v13.5M15 6.5V20"/></svg>
        Explore
      </button>
      <button class="tab" type="button" role="tab" data-tab="tours" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8 18h7.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H16"/></svg>
        Tours
      </button>
      <button class="tab" type="button" role="tab" data-tab="saved" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fillable" d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill-opacity=".18"/></svg>
        Saved
      </button>
      <button class="tab" type="button" role="tab" data-tab="visits" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fillable" d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z" fill-opacity=".18"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg>
        Visits
        <span class="tab__badge" id="visitBadge" hidden></span>
      </button>
    </nav>

    <div class="toast glass" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
